<html lang="en">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#f1f5f0;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:13px;color:#111827}
.lock{position:fixed;inset:0;background:#0d1f12;display:flex;align-items:center;justify-content:center;z-index:9999}
.lockbox{width:340px;padding:0 20px;text-align:center}
.lock-logo{font-size:30px;font-weight:700;color:#fff;letter-spacing:-.5px;margin-bottom:4px}
.lock-sub{color:rgba(255,255,255,.35);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:36px}
.lock-heading{font-size:15px;font-weight:500;color:rgba(255,255,255,.8);margin-bottom:20px}
.lock-lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.4);margin-bottom:7px;text-align:left}
.lock-pw-wrap{position:relative;margin-bottom:12px}
.lock-input{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:12px 42px 12px 14px;color:#fff;font-size:15px;font-family:inherit;outline:none}
.lock-input::placeholder{color:rgba(255,255,255,.25)}
.lock-input:focus{border-color:#4ade80}
.lock-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:rgba(255,255,255,.4);cursor:pointer;font-size:16px;padding:4px}
.lock-btn{width:100%;background:#16a34a;border:none;border-radius:8px;padding:13px;color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;margin-bottom:10px}
.lock-btn:hover{background:#15803d}
.lock-btn:disabled{background:#6b7280;cursor:default}
.lock-err{font-size:12px;color:#f87171;min-height:18px;margin-bottom:6px}
.lock-hint{font-size:11px;color:rgba(255,255,255,.25);line-height:1.6;margin-top:12px}
.app{display:flex;height:100vh;overflow:hidden}
.sb{width:220px;flex-shrink:0;background:#0d1f12;display:flex;flex-direction:column;overflow-y:auto}
.logo{padding:1.1rem 1rem;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0}
.lo-name{color:#fff;font-size:16px;font-weight:600;letter-spacing:-.3px}
.lo-sub{color:rgba(255,255,255,.3);font-size:9px;text-transform:uppercase;letter-spacing:1.2px;margin-top:3px}
.snav{padding:.5rem 0;flex:1}
.nsec{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:rgba(255,255,255,.28);padding:.9rem 1rem .3rem}
.ni{display:flex;align-items:center;gap:9px;padding:9px 1rem;cursor:pointer;color:rgba(255,255,255,.5);font-size:13px;border-left:2.5px solid transparent;transition:all .1s;user-select:none}
.ni:hover{color:rgba(255,255,255,.82);background:rgba(255,255,255,.04)}
.ni.on{color:#fff;background:rgba(74,222,128,.13);border-left-color:#4ade80}
.ni i{font-size:15px;width:18px;flex-shrink:0}
.nbadge{margin-left:auto;font-size:9px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.3);padding:2px 6px;border-radius:20px}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{height:50px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;flex-shrink:0}
.tb-tit{font-size:14px;font-weight:600;color:#111827}
.tb-right{display:flex;align-items:center;gap:6px}
.tb-dt{font-size:11px;color:#9ca3af;font-family:'IBM Plex Mono',monospace}
.tb-btn{background:none;border:1px solid #e5e7eb;cursor:pointer;padding:5px 10px;border-radius:6px;font-size:11px;color:#9ca3af;font-family:inherit;display:flex;align-items:center;gap:4px}
.tb-btn:hover{background:#fee2e2;color:#dc2626;border-color:#fca5a5}
.tb-btn.gear:hover{background:#f3f4f6;color:#374151;border-color:#d1d5db}
#content{flex:1;overflow-y:auto;padding:1.2rem 1.5rem;background:#f1f5f0}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:1.1rem 1.25rem;margin-bottom:.9rem}
.card:last-child{margin-bottom:0}
.ch{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:#9ca3af;margin-bottom:.9rem}
.cat-tabs{display:flex;gap:6px;margin-bottom:.9rem;flex-wrap:wrap}
button.ct{padding:5px 14px;border-radius:20px;border:1px solid #e5e7eb;font-size:12px;cursor:pointer;color:#6b7280;background:#fff;font-family:inherit}
button.ct.on{background:#f0fdf4;border-color:#16a34a;color:#15803d;font-weight:500}
.empty{padding:2.5rem;text-align:center;background:#f9fafb;border-radius:10px;border:1px dashed #e5e7eb;color:#9ca3af}
.empty i{font-size:28px;display:block;margin-bottom:8px}
.soon{padding:3.5rem 2rem;text-align:center;background:#f9fafb;border-radius:12px;border:1px dashed #e5e7eb}
.soon i{font-size:36px;color:#d1d5db;display:block;margin-bottom:12px}
.pbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:8px;margin-bottom:.9rem}
.pb{background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:8px;padding:12px 8px;cursor:pointer;text-align:center;transition:all .12s;user-select:none}
.pb:hover,.pb.on{border-color:#16a34a;background:#f0fdf4}
.pb i{font-size:22px;color:#6b7280;display:block;margin-bottom:6px}
.pb.on i{color:#16a34a}
.pb-lbl{font-size:11px;font-weight:500;color:#374151;line-height:1.3}
.result{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:1.2rem}
.res-name{font-size:16px;font-weight:600;color:#15803d;margin-bottom:1rem}
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px;margin-bottom:1rem}
.sl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#6b7280;margin-bottom:4px}
.sv{font-size:14px;font-weight:500;font-family:'IBM Plex Mono',monospace;color:#111827;line-height:1.4}
.sv.plain{font-family:'IBM Plex Sans',sans-serif;font-size:12px;font-weight:400}
.dbox{background:#fff;border:1px solid #bbf7d0;border-radius:7px;padding:10px 12px;margin-bottom:8px}
.dlbl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#9ca3af;margin-bottom:4px}
.dval{font-size:12px;color:#374151;line-height:1.6}
.rnote{font-size:12px;color:#166534;background:#dcfce7;padding:9px 12px;border-radius:7px;line-height:1.6}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
a.plink{display:block;padding:11px 13px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;text-decoration:none}
a.plink:hover{background:#eff6ff;border-color:#93c5fd}
.pl-name{font-size:12px;font-weight:500;color:#111827;margin-bottom:2px}
.pl-url{font-size:10px;color:#9ca3af;font-family:'IBM Plex Mono',monospace}
.pl-desc{font-size:11px;color:#9ca3af;margin-top:3px}
.clf{background:#fff;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:8px;overflow:hidden}
.clf-h{display:flex;align-items:center;gap:10px;padding:.9rem 1.2rem;cursor:pointer;user-select:none}
.clf-title{font-size:13px;font-weight:500;color:#111827;flex:1;line-height:1.4}
.clf-meta{font-size:11px;color:#9ca3af;margin-top:2px}
.prog{font-size:11px;background:#dcfce7;color:#15803d;padding:2px 8px;border-radius:20px;font-weight:500;flex-shrink:0}
.cl-items{padding:.8rem 1.2rem;border-top:1px solid #f3f4f6;display:flex;flex-direction:column;gap:6px}
.ci{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;background:#f9fafb;border-radius:6px;cursor:pointer}
.ci:hover{background:#f3f4f6}
.ci.ck{background:#f0fdf4}
.cbox{width:18px;height:18px;border:1.5px solid #d1d5db;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;background:#fff}
.cbox.ck{background:#16a34a;border-color:#16a34a}
.cl-text{font-size:12px;color:#374151;line-height:1.5}
.ci.ck .cl-text{color:#9ca3af;text-decoration:line-through}
button.rbtn{margin-top:10px;font-size:11px;padding:5px 12px;border:1px solid #e5e7eb;border-radius:6px;background:#fff;color:#9ca3af;cursor:pointer;font-family:inherit}
.rt{width:100%;border-collapse:collapse}
.rt th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#9ca3af;text-align:left;padding:6px 8px;border-bottom:1px solid #f3f4f6}
.rt td{padding:9px 8px;border-bottom:1px solid #fafafa;font-size:13px;color:#374151}
.rt tr:last-child td{border-bottom:none}
input.ri{border:none;background:transparent;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#374151;width:70px;text-align:right;padding:2px 5px;border-radius:4px}
input.ri:focus{outline:none;background:#f0fdf4}
button.gbtn{padding:7px 15px;border:1px solid #16a34a;border-radius:7px;background:#fff;color:#16a34a;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit}
button.gbtn.on{background:#f0fdf4}
.dqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.dq{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:14px 12px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;transition:all .12s;user-select:none}
.dq:hover{border-color:#4ade80;background:#f0fdf0}
.dq.dim{opacity:.45;cursor:default;pointer-events:none}
.dq i{font-size:22px;color:#6b7280}
.dq-lbl{font-size:12px;font-weight:500;color:#374151}
.p2b{font-size:9px;background:#f0fdf4;color:#15803d;padding:2px 7px;border-radius:10px}
.hpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px}
a.hp{display:block;padding:10px 12px;border-radius:8px;text-decoration:none;border:1px solid;font-size:12px;font-weight:500}
.add-form{display:grid;grid-template-columns:140px 1fr 90px 1fr 36px;gap:8px;align-items:end;margin-bottom:1rem}
.fl{display:flex;flex-direction:column;gap:4px}
.fl label{font-size:10px;color:#9ca3af;font-weight:500;text-transform:uppercase;letter-spacing:.4px}
.fl input,.fl select{border:1px solid #e5e7eb;border-radius:7px;padding:7px 10px;font-size:13px;font-family:inherit;background:#fff;color:#111827;outline:none;width:100%}
.fl input:focus,.fl select:focus{border-color:#16a34a}
button.add-btn{background:#16a34a;color:#fff;border:none;border-radius:7px;padding:0;font-size:20px;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
button.add-btn:hover{background:#15803d}
.day-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#f0fdf4;border-radius:8px;border:1px solid #bbf7d0;margin-bottom:.75rem;flex-wrap:wrap;gap:6px}
.day-total{font-size:18px;font-weight:600;color:#15803d;font-family:'IBM Plex Mono',monospace}
.day-meta{font-size:12px;color:#16a34a}
.date-nav{display:flex;align-items:center;gap:8px;margin-bottom:.75rem}
.date-nav button{background:#fff;border:1px solid #e5e7eb;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px;color:#374151;font-family:inherit}
.date-nav button:hover{background:#f9fafb}
.date-nav span{font-size:13px;font-weight:500;color:#111827;font-family:'IBM Plex Mono',monospace}
.dtable{width:100%;border-collapse:collapse}
.dtable th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#9ca3af;text-align:left;padding:6px 10px;border-bottom:1px solid #f3f4f6;white-space:nowrap}
.dtable td{padding:9px 10px;border-bottom:1px solid #fafafa;font-size:13px;color:#374151;vertical-align:middle}
.dtable tr:last-child td{border-bottom:none}
.dtable tr:hover td{background:#fafafa}
.ico-btn{background:none;border:none;cursor:pointer;padding:4px 6px;border-radius:5px;font-size:15px;color:#9ca3af}
.ico-btn:hover{background:#f3f4f6;color:#374151}
.ico-btn.del:hover{background:#fee2e2;color:#dc2626}
.amt{font-family:'IBM Plex Mono',monospace;font-weight:500}
.svc-pill{font-size:10px;padding:2px 8px;border-radius:20px;background:#f3f4f6;color:#374151;display:inline-block}
.inc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:1rem}
.inc-card{background:#f9fafb;border-radius:9px;padding:14px;border:1px solid #f3f4f6}
.inc-card.hi{background:#f0fdf4;border-color:#bbf7d0}
.inc-card.am{background:#fffbeb;border-color:#fde68a}
.inc-val{font-size:22px;font-weight:600;color:#111827;font-family:'IBM Plex Mono',monospace}
.inc-card.hi .inc-val{color:#15803d}
.inc-card.am .inc-val{color:#92400e}
.inc-lbl{font-size:11px;color:#9ca3af;margin-top:3px}
.rcpt-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:500}
.rcpt-box{background:#fff;border-radius:12px;padding:1.75rem;width:300px;max-width:90vw}
.rcpt-head{text-align:center;padding-bottom:1rem;border-bottom:1px dashed #e5e7eb;margin-bottom:1rem}
.rcpt-biz{font-size:15px;font-weight:600}
.rcpt-addr{font-size:11px;color:#9ca3af;margin-top:3px;line-height:1.5}
.rcpt-row{display:flex;justify-content:space-between;font-size:13px;color:#374151;padding:4px 0}
.rcpt-row.tot{font-weight:600;font-size:15px;border-top:1px solid #e5e7eb;margin-top:8px;padding-top:10px}
.rcpt-thanks{text-align:center;font-size:11px;color:#9ca3af;margin-top:1rem}
.rcpt-btns{display:flex;gap:8px;margin-top:1.25rem}
.rcpt-btns button{flex:1;padding:9px;border-radius:7px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500}
.r-print{background:#16a34a;color:#fff;border:none}
.r-print:hover{background:#15803d}
.r-close{background:#f9fafb;color:#374151;border:1px solid #e5e7eb}
.wa-card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:1rem 1.25rem;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px}
.wa-msg{flex:1;font-size:13px;color:#374151;line-height:1.6}
.wa-label{font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
button.copy-btn{background:#f9fafb;border:1px solid #e5e7eb;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;color:#374151;white-space:nowrap;flex-shrink:0}
button.copy-btn:hover{background:#f0fdf4;border-color:#86efac;color:#15803d}
button.copy-btn.copied{background:#f0fdf4;border-color:#16a34a;color:#15803d}
@media print{body>*{display:none!important}#print-target{display:block!important;padding:24px;font-family:sans-serif}}
@media(max-width:640px){
  .add-form{grid-template-columns:1fr 1fr}
  .app{flex-direction:column;height:auto}
  .sb{width:100%;flex-direction:row;overflow-x:auto;overflow-y:hidden}
  .logo{padding:.7rem 1rem;border-right:1px solid rgba(255,255,255,.07);border-bottom:none;flex-shrink:0}
  .lo-sub{display:none}
  .snav{display:flex;flex-direction:row;padding:.3rem 0;align-items:center}
  .nsec{display:none}
  .ni{padding:8px 12px;flex-direction:column;gap:3px;border-left:none;border-bottom:2.5px solid transparent;font-size:10px;flex-shrink:0}
  .ni.on{border-left:none;border-bottom-color:#4ade80}
  .ni i{font-size:18px;width:auto}
  .nbadge{display:none}
  .main{overflow:visible}
  #content{overflow:visible;padding:1rem}
}
</style>
</head>
<body>

<div class="lock" id="lockscreen">
  <div class="lockbox">
    <div class="lock-logo">SevaDesk</div>
    <div class="lock-sub">Sai Tilak Enterprises · Ambernath</div>
    <div class="lock-heading" id="lock-heading">Enter your password</div>
    <div class="lock-lbl" id="lock-lbl">Password</div>
    <div class="lock-pw-wrap">
      <input class="lock-input" type="password" id="pwd-input" placeholder="Your password" autocomplete="current-password">
      <button class="lock-eye" id="eye-btn" onclick="toggleEye()"><i class="ti ti-eye" id="eye-ico"></i></button>
    </div>
    <div class="lock-err" id="lock-err"></div>
    <button class="lock-btn" id="lock-submit" onclick="handleLockSubmit()">Unlock</button>
    <div class="lock-hint" id="lock-hint"></div>
  </div>
</div>

<div id="print-target" style="display:none"></div>

<div class="app" id="appwrap" style="display:none">
  <div class="sb">
    <div class="logo"><div class="lo-name">SevaDesk</div><div class="lo-sub">STE · Ambernath</div></div>
    <div class="snav">
      <div class="nsec">Main</div>
      <div class="ni on" data-s="dash"><i class="ti ti-layout-dashboard"></i><span>Dashboard</span></div>
      <div class="ni" data-s="print"><i class="ti ti-printer"></i><span>Print Helper</span></div>
      <div class="ni" data-s="checklists"><i class="ti ti-checklist"></i><span>Checklists</span></div>
      <div class="ni" data-s="portals"><i class="ti ti-world"></i><span>Portal Links</span></div>
      <div class="ni" data-s="rates"><i class="ti ti-receipt"></i><span>Rate Card</span></div>
      <div class="nsec">Operations</div>
      <div class="ni" data-s="customers"><i class="ti ti-users"></i><span>Customer Log</span></div>
      <div class="ni" data-s="income"><i class="ti ti-coin"></i><span>Income</span></div>
      <div class="ni" data-s="wa"><i class="ti ti-brand-whatsapp"></i><span>WA Templates</span></div>
      <div class="nsec">STE</div>
      <div class="ni" data-s="supplies"><i class="ti ti-package"></i><span>Supplies</span><span class="nbadge">P3</span></div>
      <div class="ni" data-s="mis"><i class="ti ti-chart-bar"></i><span>MIS Report</span><span class="nbadge">P3</span></div>
      <div class="ni" data-s="helplines"><i class="ti ti-phone"></i><span>Helplines</span><span class="nbadge">P3</span></div>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <span class="tb-tit" id="tb-tit">Dashboard</span>
      <div class="tb-right">
        <span class="tb-dt" id="tb-dt"></span>
        <button class="tb-btn gear" onclick="changePwd()"><i class="ti ti-settings"></i></button>
        <button class="tb-btn" onclick="doLogout()"><i class="ti ti-lock"></i> Lock</button>
      </div>
    </div>
    <div id="content"></div>
  </div>
</div>

<script>
async function sha256(str){var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str+'__seva__'));return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');}
function isFirst(){return !localStorage.getItem('seva_hash');}
function isLoggedIn(){return !!sessionStorage.getItem('seva_auth');}

async function handleLockSubmit(){
  var pwd=document.getElementById('pwd-input').value.trim();
  if(!pwd){document.getElementById('lock-err').textContent='Please enter a password.';return;}
  var btn=document.getElementById('lock-submit');btn.disabled=true;btn.textContent='Checking...';
  var hash=await sha256(pwd);
  if(isFirst()){
    if(pwd.length<6){document.getElementById('lock-err').textContent='Minimum 6 characters.';btn.disabled=false;btn.textContent='Set Password';return;}
    localStorage.setItem('seva_hash',hash);sessionStorage.setItem('seva_auth','1');showApp();
  }else{
    if(hash===localStorage.getItem('seva_hash')){sessionStorage.setItem('seva_auth','1');showApp();}
    else{document.getElementById('lock-err').textContent='Wrong password. Try again.';document.getElementById('pwd-input').value='';document.getElementById('pwd-input').focus();btn.disabled=false;btn.textContent='Unlock';}
  }
}

function showLock(){
  document.getElementById('appwrap').style.display='none';document.getElementById('lockscreen').style.display='flex';
  if(isFirst()){document.getElementById('lock-heading').textContent='Welcome — set your access password';document.getElementById('lock-lbl').textContent='Choose a password (min 6 characters)';document.getElementById('lock-submit').textContent='Set Password';document.getElementById('lock-hint').textContent='Stored only on this device. Required every time you open SevaDesk.';}
  else{document.getElementById('lock-heading').textContent='Enter your password';document.getElementById('lock-lbl').textContent='Password';document.getElementById('lock-submit').textContent='Unlock';document.getElementById('lock-hint').textContent='';}

function rPrint(){

  var h='<div class="card"><div class="cat-tabs">'+cats.map(function(c){return '<button class="ct'+(pcat===c?' on':'')+'" onclick="setPCat(\''+c+'\')">'+c+'</button>';}).join('')+'</div>'
    +'<div class="pbgrid">'+items.map(function(p){return '<div class="pb'+(psel===p.id?' on':'')+'" onclick="setPItem(\''+p.id+'\')"><i class="ti '+p.i+'"></i><div class="pb-lbl">'+p.l+'</div></div>';}).join('')+'</div></div>';
  if(item){h+='<div class="result"><div class="res-name">'+item.l+'</div><div class="specs"><div><div class="sl">Size (mm)</div><div class="sv">'+item.mm+'</div></div><div><div class="sl">Size (inches)</div><div class="sv">'+item.inch+'</div></div><div><div class="sl">Resolution</div><div class="sv">'+item.dpi+'</div></div><div><div class="sl">Paper type</div><div class="sv plain">'+item.paper+'</div></div><div><div class="sl">Per A4 sheet</div><div class="sv plain">'+item.a4+'</div></div><div><div class="sl">Lamination size</div><div class="sv plain">'+item.lami+'</div></div></div><div class="dbox"><div class="dlbl">Printer dialog setting</div><div class="dval">'+item.dialog+'</div></div><div class="rnote">'+item.note+'</div></div>';}
  else{h+='<div class="empty"><i class="ti ti-hand-click"></i>Tap any document above to see exact print settings</div>';}
  return h;
}

  }).join('');
}
function togCL(id){openCL=(openCL===id)?null:id;document.getElementById('content').innerHTML=rCL();}
function tickI(lid,i){ticked[lid+'-'+i]=!ticked[lid+'-'+i];document.getElementById('content').innerHTML=rCL();}
function resetCL(lid){CL.filter(function(c){return c.id===lid;})[0].items.forEach(function(_,i){delete ticked[lid+'-'+i];});document.getElementById('content').innerHTML=rCL();}
var ticked={};

function rRates(){
  var cats=[];rates.forEach(function(r){if(cats.indexOf(r.c)<0)cats.push(r.c);});
  var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem"><div style="font-size:12px;color:#9ca3af">Tap any amount to edit. Auto-saved.</div><button class="gbtn'+(editRates?' on':'')+'" onclick="togEdit()">'+(editRates?'Done editing':'Edit my rates')+'</button></div>';
  cats.forEach(function(cat){h+='<div class="card"><div class="ch">'+cat+'</div><table class="rt"><thead><tr><th>Service</th><th style="text-align:right">Your rate</th></tr></thead><tbody>';rates.forEach(function(r,i){if(r.c===cat)h+='<tr><td>'+r.s+'</td><td style="text-align:right">'+(editRates?'<input class="ri" type="number" value="'+r.r+'" onchange="updRate('+i+',this.value)">':'<span style="font-family:\'IBM Plex Mono\',monospace;font-weight:500">\u20b9'+r.r+'</span>')+'</td></tr>';});h+='</tbody></table></div>';});
  return h;
}
function togEdit(){editRates=!editRates;document.getElementById('content').innerHTML=rRates();}
function updRate(i,v){rates[i]={s:rates[i].s,r:Number(v),c:rates[i].c};try{localStorage.setItem('seva_rates',JSON.stringify(rates));}catch(e){}}

var viewDate=todayStr();
function getCustomers(){try{return JSON.parse(localStorage.getItem('seva_customers'))||[];}catch(e){return [];}}
function saveCustomers(a){try{localStorage.setItem('seva_customers',JSON.stringify(a));}catch(e){}}

function addCustomer(){
  var name=document.getElementById('c-name').value.trim();
  var service=document.getElementById('c-service').value.trim();
  var amount=parseFloat(document.getElementById('c-amount').value)||0;
  var notes=document.getElementById('c-notes').value.trim();
  if(!name||!service||!amount){alert('Please fill Name, Service, and Amount.');return;}
  var customers=getCustomers(),now=new Date();
  customers.unshift({id:Date.now(),name:name,service:service,amount:amount,notes:notes,date:now.toISOString().slice(0,10),time:now.toTimeString().slice(0,5)});
  saveCustomers(customers);
  document.getElementById('c-name').value='';document.getElementById('c-service').value='';document.getElementById('c-amount').value='';document.getElementById('c-notes').value='';
  document.getElementById('content').innerHTML=rCustomers();
}

function delCustomer(id){if(!confirm('Delete this entry?'))return;saveCustomers(getCustomers().filter(function(c){return c.id!==id;}));document.getElementById('content').innerHTML=rCustomers();}
function prevDay(){var d=new Date(viewDate);d.setDate(d.getDate()-1);viewDate=d.toISOString().slice(0,10);document.getElementById('content').innerHTML=rCustomers();}
function nextDay(){var d=new Date(viewDate);d.setDate(d.getDate()+1);if(viewDate<todayStr()){viewDate=d.toISOString().slice(0,10);document.getElementById('content').innerHTML=rCustomers();}}
function goToday(){viewDate=todayStr();document.getElementById('content').innerHTML=rCustomers();}

var svcList=['Aadhaar Print (A4)','Aadhaar + Lamination','PAN Print + Lamination','Passport Photo (2)','Passport Photo (4)','Photocopy A4 (B&W)','Photocopy A4 (Colour)','Print A4 (B&W)','Print A4 (Colour)','Scanning','Lamination Card','Lamination A4','Aadhaar Update','PAN New Application','Income Certificate','Caste Certificate','Domicile Certificate','7/12 Satbara Extract','Voter ID Registration','Passport Application','Driving License','e-Shram Card','IRCTC Ticket','Electricity Bill','Mobile Recharge','DTH Recharge','AEPS Withdrawal','AEPS Balance Check','Other'];

function rCustomers(){
  viewDate=viewDate||todayStr();
  var all=getCustomers(),day=all.filter(function(c){return c.date===viewDate;});
  var dayTotal=day.reduce(function(s,c){return s+c.amount;},0);
  var isToday=viewDate===todayStr();
  var h='<div class="card"><div class="ch">Add walk-in customer</div>'
    +'<div class="add-form">'
    +'<div class="fl"><label>Name</label><input id="c-name" placeholder="e.g. Ramesh Patil" autocomplete="off"></div>'
    +'<div class="fl"><label>Service</label><input id="c-service" list="svc-list" placeholder="Select or type" autocomplete="off"><datalist id="svc-list">'+svcList.map(function(s){return '<option value="'+s+'">';}).join('')+'</datalist></div>'
    +'<div class="fl"><label>Amount \u20b9</label><input id="c-amount" type="number" placeholder="0" min="0"></div>'
    +'<div class="fl"><label>Notes</label><input id="c-notes" placeholder="Optional..."></div>'
    +'<button class="add-btn" onclick="addCustomer()" title="Add"><i class="ti ti-plus"></i></button>'
    +'</div></div>'
    +'<div class="date-nav">'
    +'<button onclick="prevDay()"><i class="ti ti-chevron-left"></i></button>'
    +'<span>'+fmtDate(viewDate)+(isToday?' (Today)':'')+'</span>'
    +'<button onclick="nextDay()" '+(isToday?'disabled style="opacity:.4"':'')+'><i class="ti ti-chevron-right"></i></button>'
    +(isToday?'':'<button onclick="goToday()" style="font-size:12px">Today</button>')
    +'</div>';
  if(day.length>0){
    h+='<div class="day-bar"><div><div class="day-total">'+fmtAmt(dayTotal)+'</div><div class="day-meta">'+day.length+' customer'+(day.length!==1?'s':'')+'</div></div></div>';
    h+='<div class="card" style="padding:0;overflow:hidden"><table class="dtable"><thead><tr><th>Time</th><th>Name</th><th>Service</th><th>Amount</th><th>Notes</th><th></th></tr></thead><tbody>';
    day.forEach(function(c){h+='<tr><td style="color:#9ca3af;font-family:\'IBM Plex Mono\',monospace;font-size:11px">'+c.time+'</td><td style="font-weight:500">'+c.name+'</td><td><span class="svc-pill">'+c.service+'</span></td><td class="amt">'+fmtAmt(c.amount)+'</td><td style="color:#9ca3af;font-size:12px">'+(c.notes||'\u2014')+'</td><td style="white-space:nowrap"><button class="ico-btn" onclick="openReceipt('+c.id+')" title="Receipt"><i class="ti ti-printer"></i></button><button class="ico-btn del" onclick="delCustomer('+c.id+')" title="Delete"><i class="ti ti-trash"></i></button></td></tr>';});
    h+='</tbody></table></div>';
  }else{
    h+='<div class="empty"><i class="ti ti-user-plus"></i>No customers for '+fmtDate(viewDate)+'.</div>';
  }
  return h;
}

function openReceipt(id){
  var c=getCustomers().filter(function(x){return x.id===id;})[0];if(!c)return;
  var h='<div class="rcpt-overlay" id="rcpt-overlay"><div class="rcpt-box">'
    +'<div class="rcpt-head"><div class="rcpt-biz">Sai Tilak Enterprises</div><div class="rcpt-addr">Ambernath, Thane, Maharashtra</div></div>'
    +'<div class="rcpt-row"><span style="color:#9ca3af">Date</span><span>'+fmtDate(c.date)+'</span></div>'
    +'<div class="rcpt-row"><span style="color:#9ca3af">Time</span><span>'+c.time+'</span></div>'
    +'<div class="rcpt-row"><span style="color:#9ca3af">Customer</span><span style="font-weight:500">'+c.name+'</span></div>'
    +'<div class="rcpt-row"><span style="color:#9ca3af">Service</span><span>'+c.service+'</span></div>'
    +(c.notes?'<div class="rcpt-row"><span style="color:#9ca3af">Notes</span><span style="font-size:12px">'+c.notes+'</span></div>':'')
    +'<div class="rcpt-row tot"><span>Total</span><span>'+fmtAmt(c.amount)+'</span></div>'
    +'<div class="rcpt-thanks">Thank you for visiting STE!</div>'
    +'<div class="rcpt-btns"><button class="r-print" onclick="doPrint('+c.id+')"><i class="ti ti-printer" style="margin-right:5px"></i>Print</button><button class="r-close" onclick="closeReceipt()">Close</button></div>'
    +'</div></div>';
  document.getElementById('content').insertAdjacentHTML('beforeend',h);
}

function closeReceipt(){var o=document.getElementById('rcpt-overlay');if(o)o.remove();}

function doPrint(id){
  var c=getCustomers().filter(function(x){return x.id===id;})[0];if(!c)return;
  var pt=document.getElementById('print-target');pt.style.display='block';
  pt.innerHTML='<div style="font-family:sans-serif;max-width:280px;margin:0 auto"><div style="text-align:center;border-bottom:1px dashed #ccc;padding-bottom:12px;margin-bottom:12px"><div style="font-size:16px;font-weight:700">Sai Tilak Enterprises</div><div style="font-size:11px;color:#666;margin-top:3px">Ambernath, Thane, Maharashtra</div></div><table style="width:100%;font-size:13px;border-collapse:collapse"><tr><td style="color:#666;padding:3px 0">Date</td><td style="text-align:right">'+fmtDate(c.date)+'</td></tr><tr><td style="color:#666;padding:3px 0">Time</td><td style="text-align:right">'+c.time+'</td></tr><tr><td style="color:#666;padding:3px 0">Customer</td><td style="text-align:right;font-weight:600">'+c.name+'</td></tr><tr><td style="color:#666;padding:3px 0">Service</td><td style="text-align:right">'+c.service+'</td></tr>'+(c.notes?'<tr><td style="color:#666;padding:3px 0">Notes</td><td style="text-align:right">'+c.notes+'</td></tr>':'')+'<tr style="border-top:1px solid #ccc"><td style="font-weight:700;padding-top:8px;font-size:15px">Total</td><td style="text-align:right;font-weight:700;font-size:15px;padding-top:8px">'+fmtAmt(c.amount)+'</td></tr></table><div style="text-align:center;font-size:11px;color:#999;margin-top:14px;border-top:1px dashed #ccc;padding-top:10px">Thank you for visiting STE!</div></div>';
  window.print();
  setTimeout(function(){pt.style.display='none';pt.innerHTML='';},500);
}

function getExpenses(){try{return JSON.parse(localStorage.getItem('seva_expenses'))||[];}catch(e){return [];}}
function saveExpenses(a){try{localStorage.setItem('seva_expenses',JSON.stringify(a));}catch(e){}}

function addExpense(){
  var item=document.getElementById('exp-item').value.trim(),amount=parseFloat(document.getElementById('exp-amount').value)||0;
  if(!item||!amount){alert('Enter item and amount.');return;}
  var exps=getExpenses(),now=new Date();
  exps.unshift({id:Date.now(),item:item,amount:amount,date:now.toISOString().slice(0,10)});
  saveExpenses(exps);document.getElementById('exp-item').value='';document.getElementById('exp-amount').value='';
  document.getElementById('content').innerHTML=rIncome();
}
function delExpense(id){if(!confirm('Delete?'))return;saveExpenses(getExpenses().filter(function(e){return e.id!==id;}));document.getElementById('content').innerHTML=rIncome();}

function sumI(s,e){return getCustomers().filter(function(c){return c.date>=s&&c.date<=e;}).reduce(function(t,c){return t+c.amount;},0);}
function sumE(s,e){return getExpenses().filter(function(x){return x.date>=s&&x.date<=e;}).reduce(function(t,x){return t+x.amount;},0);}
function wkStart(){var d=new Date();d.setDate(d.getDate()-d.getDay());return d.toISOString().slice(0,10);}
function moStart(){return todayStr().slice(0,7)+'-01';}

function rIncome(){
  var td=todayStr(),ws=wkStart(),ms=moStart();
  var tI=sumI(td,td),wI=sumI(ws,td),mI=sumI(ms,td),tE=sumE(td,td),mE=sumE(ms,td),tN=tI-tE;
  var mc=getCustomers().filter(function(c){return c.date>=ms&&c.date<=td;});
  var sm={};mc.forEach(function(c){if(!sm[c.service])sm[c.service]={n:0,t:0};sm[c.service].n++;sm[c.service].t+=c.amount;});
  var sa=Object.keys(sm).map(function(k){return {s:k,n:sm[k].n,t:sm[k].t};}).sort(function(a,b){return b.t-a.t;});
  var h='<div class="inc-grid">'
    +'<div class="inc-card hi"><div class="inc-val">'+fmtAmt(tI)+'</div><div class="inc-lbl">Today\'s income</div></div>'
    +'<div class="inc-card"><div class="inc-val">'+fmtAmt(wI)+'</div><div class="inc-lbl">This week</div></div>'
    +'<div class="inc-card"><div class="inc-val">'+fmtAmt(mI)+'</div><div class="inc-lbl">This month</div></div>'
    +'<div class="inc-card '+(tN>=0?'hi':'am')+'"><div class="inc-val">'+fmtAmt(tN)+'</div><div class="inc-lbl">Net profit today</div></div>'
    +'<div class="inc-card am"><div class="inc-val">'+fmtAmt(mE)+'</div><div class="inc-lbl">Expenses this month</div></div>'
    +'</div>';
  if(sa.length>0){
    h+='<div class="card"><div class="ch">Service breakdown \u2014 this month</div><table class="dtable"><thead><tr><th>Service</th><th>Count</th><th>Total</th></tr></thead><tbody>';
    sa.forEach(function(x){h+='<tr><td><span class="svc-pill">'+x.s+'</span></td><td style="color:#9ca3af">'+x.n+'\xd7</td><td class="amt">'+fmtAmt(x.t)+'</td></tr>';});
    h+='</tbody></table></div>';
  }
  var tc=getCustomers().filter(function(c){return c.date===td;});
  if(tc.length>0){
    h+='<div class="card"><div class="ch">Today\'s customers</div><table class="dtable"><thead><tr><th>Time</th><th>Name</th><th>Service</th><th>Amount</th></tr></thead><tbody>';
    tc.forEach(function(c){h+='<tr><td style="color:#9ca3af;font-family:\'IBM Plex Mono\',monospace;font-size:11px">'+c.time+'</td><td style="font-weight:500">'+c.name+'</td><td><span class="svc-pill">'+c.service+'</span></td><td class="amt">'+fmtAmt(c.amount)+'</td></tr>';});
    h+='</tbody></table></div>';
  }
  h+='<div class="card"><div class="ch">Add expense</div><div class="add-form" style="grid-template-columns:1fr 100px 36px"><div class="fl"><label>Item</label><input id="exp-item" placeholder="e.g. A4 paper 1 ream"></div><div class="fl"><label>Amount \u20b9</label><input id="exp-amount" type="number" placeholder="0"></div><button class="add-btn" onclick="addExpense()"><i class="ti ti-plus"></i></button></div></div>';
  var exps=getExpenses().slice(0,20);
  if(exps.length>0){
    h+='<div class="card"><div class="ch">Recent expenses</div><table class="dtable"><thead><tr><th>Date</th><th>Item</th><th>Amount</th><th></th></tr></thead><tbody>';
    exps.forEach(function(e){h+='<tr><td style="color:#9ca3af;font-size:11px;font-family:\'IBM Plex Mono\',monospace">'+fmtDate(e.date)+'</td><td>'+e.item+'</td><td class="amt" style="color:#dc2626">'+fmtAmt(e.amount)+'</td><td><button class="ico-btn del" onclick="delExpense('+e.id+')"><i class="ti ti-trash"></i></button></td></tr>';});
    h+='</tbody></table></div>';
  }
  return h;
}

function rWA(){
  return '<div style="margin-bottom:.75rem;font-size:12px;color:#9ca3af">Tap Copy on any template. Replace words in {curly brackets} with actual details before sending.</div>'
    +WA.map(function(w,i){return '<div class="wa-card"><div class="wa-msg"><div class="wa-label">'+w.label+'</div>'+w.msg+'</div><button class="copy-btn" id="wb'+i+'" onclick="copyWA('+i+')"><i class="ti ti-copy"></i> Copy</button></div>';}).join('');
}

function copyWA(i){
  navigator.clipboard.writeText(WA[i].msg).then(function(){var b=document.getElementById('wb'+i);b.textContent='\u2713 Copied';b.classList.add('copied');setTimeout(function(){b.innerHTML='<i class="ti ti-copy"></i> Copy';b.classList.remove('copied');},2000);}).catch(function(){alert('Copy manually:\n\n'+WA[i].msg);});
}
